image: node:20-alpine

stages:
  - install
  - lint
  - build
  - deploy

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/
    - client/node_modules/
    - server/node_modules/

# ── Instalación ──────────────────────────────────────────────
install:
  stage: install
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
      - client/node_modules/
      - server/node_modules/
    expire_in: 1 hour

# ── Lint ─────────────────────────────────────────────────────
lint:
  stage: lint
  needs: [install]
  script:
    - npm run lint

# ── Build ────────────────────────────────────────────────────
build:
  stage: build
  needs: [install]
  script:
    - npm run build
  artifacts:
    paths:
      - client/dist/
      - server/dist/
    expire_in: 1 week

# ── Deploy ───────────────────────────────────────────────────
deploy:
  stage: deploy
  needs: [lint, build]
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY_B64" | base64 -d > /tmp/deploy_key
    - 'wc -c /tmp/deploy_key'
    - chmod 600 /tmp/deploy_key
    - ssh-add /tmp/deploy_key
    - rm -f /tmp/deploy_key
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H 3.134.1.18 >> ~/.ssh/known_hosts
  script:
    - ssh ubuntu@3.134.1.18 "
        cd /home/ubuntu/uide_escucha &&
        git remote set-url origin https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/krisloww/uide_escucha.git &&
        git fetch origin main &&
        git reset --hard origin/main &&
        git remote set-url origin https://gitlab.com/krisloww/uide_escucha.git &&
        sudo docker compose down &&
        sudo docker compose build --no-cache &&
        sudo docker compose up -d
      "
    - echo "Despliegue completado en https://hubi.click"
  only:
    - main
  environment:
    name: production
    url: https://hubi.click